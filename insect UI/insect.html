<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insect UI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    

    <div class="left">

      <div class="logo">INSECT</div>

      <div class="search-box">
        🔍
        <input type="text" placeholder="Search...">
      </div>

      <div class="classification">Classification</div>

      <div class="details">

        <div class="item">
          <h3>Class:</h3>
          <p>Insecta</p>
        </div>

        <div class="item">
          <h3>Order:</h3>
          <p>Coleoptera</p>
        </div>

        <div class="item">
          <h3>Family:</h3>
          <p>Cerambycidae</p>
        </div>

        <div class="item">
          <h3>Sub-Family:</h3>
          <p>Cerambycinae</p>
        </div>

        <div class="item">
          <h3>Tribe:</h3>
          <p>Callichromatini</p>
        </div>

        <div class="item">
          <h3>Genus:</h3>
          <p>Pachyteria</p>
        </div>

      </div>

    </div>

    <div class="right">

      <div class="nav">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
      </div>

      <div class="content">

        <div class="title">
          Pachyteria <br> equestris
        </div>

        <div class="info">
          <div>
            <p>📍 Malaysia</p>
            <br>
            <p>♂ Male</p>
            <br>
            <p>📏 32 mm</p>
          </div>
        </div>

        <div class="price">$5.99</div>

        <div class="toggle">
          <div class="switch"></div>
          <p>View detailed antennae</p>
        </div>

        <div class="toggle">
          <div class="switch"></div>
          <p>View underside</p>
        </div>

        <button>Add to collection</button>

      </div>

    </div>

    <div class="center-image">
      <img src="https://media.istockphoto.com/id/1404975057/photo/insect-collection-of-beautiful-jewel-beetles-metaxymorpha-apicalis.jpg?s=612x612&w=0&k=20&c=JoiwsieKHP37O4h442AtEjm5efIR4-Me0GQsiXWoQlk=" alt="">
    </div>

  </div>

</body>
</html>
